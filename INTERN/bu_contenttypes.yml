# This file defines the contenttypes on the website. See the documentation for
# details: https://docs.bolt.cm/contenttypes/intro

# The Homepage contenttype is a singleton: There can be only one record of this
# contenttype.

homepage:
    name: Homepage
    singular_name: Homepage
    fields:
        title:
            label: Titel der Ausstellung
            type: html
            height: 32px
            group: content       
        image:
            type: image
            placeholder: https://source.unsplash.com/1920x640/?cityscape,landscape,nature/__random__
        teaser:
            type: html
            height: 150px
        content:
            type: html
            height: 300px
        contentlink:
            type: text
            label: Link
            placeholder: 'contenttype/slug or http://example.org/'
            postfix: "Use this to add a link for this Homepage. This could either be an 'internal' link like <tt>page//about</tt>, if you use a contenttype/slug combination. Otherwise use a proper URL, like `http://example.org`."
        slug:
            group: meta
            type: slug
            uses: title
        contentblocks:
            group: Inhaltselemente
            type: block
            label: Inhaltselement
            fields:
                imagesection:
                    label: Bild mit Legende
                    fields:
                        image:
                            type: image
                        caption:
                            label: Bildunterschrift
                            type: html
                            height: 40px
                textsection:
                    label: Textblock
                    fields:
                        heading:
                            label: Überschrift
                            type: text
                        content:
                            label: Text
                            type: html
                            height: 150px
                textwithimagesection:
                    label: Text-Bild-Kombination
                    fields:
                        heading:
                            label: Überschrift
                            type: text
                        content:
                            label: Text
                            type: html
                            height: 150px
                        image:
                            label: Abbildung
                            type: image
                        caption:
                            label: Bildunterschrift
                            type: html
                            height: 40px                 
    viewless: true
    singleton: true
    default_status: published
    icon_many: "fa:home"
    icon_one: "fa:home"

theme_content:
    name: Theme-Elemente
    singular_name: Theme-Elemente
    fields:
        navi_hint:
                group: navigation
                type: text
                class: large
                label: Erläuterung Navigation über Image-Map
        navi_items:
            label: Menüpunkte Hauptnavigation
            type: repeater
            icon: fa:repeat
            fields:
                text:
                    type: text
                    label: Beschriftung
                    class: large
                link:
                    type: text
                    label: Link (relativ)
                    class: large
    singleton: true 
    default_status: published


footer:
    name: Footer-Content
    singular_name: Footer-Content
    fields:
        title:
            group: info
            type: text
        slug:
            label: slug
            type: slug
            uses: title
            postfix: Dieser Titel wird  nicht ausgegeben
        contentblocks:
            group: Spalten
            type: block
            label: Footer-Spalte
            fields:
                imagesection:
                    label: Logo
                    fields:
                        image:
                            type: image
                            label: Logo
                        link:
                            type: text
                            label: Verlinkung für das Logo
                textsection:
                    label: Textblock
                    fields:
                        heading:
                            label: Überschrift
                            type: text
                        content:
                            label: Text
                            type: html
                            height: 150px
    viewless: true
    singleton: true
    default_status: published


objects:
    name: Objekte
    singular_name: Objekt
    fields:
        title:
            group: Info
            label: Titel
            type: text
            class: large
        slug:
            type: slug
            uses: [ title ]
        dump:
            label: Dump-Datei aus Arachne
            type: file
            upload: xml-dumps
        arachne_id:
            label: Kennnummer bei Arachne
            type: text
        object_id:
            group: Metadaten
            label: Inventar-Nr.
            type: text
        collection:
            label: Sammlung
            type: text
        comment: 
            group: Kuratorische Inhalte
            label: Objektkommentar
            type: html
            height: 240px;
        representation:
            group: Medien
            label: Digitalisat
            type: file
            upload: /representations
        video:
            label: Video
            type: file
            upload: /videos
        caption:
            label: Bildunterschrift
            type: html
            height: 60px;
        credits:
            label: Rechtehinweis
            type: html
            height: 45px
        more_representations:
            type: block
            label: Weitere Digitalisate
            fields:
                imagesection:
                    label: Digitalisat
                    fields:
                        representation:
                            label: Digitalisat
                            type: file
                            upload: /representations
                        caption:
                            label: Bildunterschrift
                            type: html
                            height: 60px;
                        credits:
                            label: Rechtehinweis
                            type: html
                            height: 45px
    recordsperpage: 200

rooms:
    name: Räume
    singular_name: Raum
    fields:
        title:
            group: info
            label: Titel
            type: text
        position:
            label: Ordnungsnummer
            type: integer
        slug:
            type: slug
            uses: [ title ]
        claim:
            label: Teaser-Zeile
            type: html
            height: 200px
        intro:
            group: Inhalte
            label: Einleitung
            type: html
            height: 400px
        representation:
            group: Medien
            label: Digitalisat
            type: file
            upload: /representations
        exhibits:
            group: Exponate
            label: Exponate
            type: repeater
            icon: fa:repeat
            fields:
                object:
                    type: select
                    label: Objekt
                    values: objects/id,title
                    autocomplete: true
                    sort: title
                slider:
                    type: select
                    label: Slider
                    values: slider/id,title
                    autocomplete: true
                    sort: title
                position:
                    type: integer
                    label: Position
                title:
                    label: Titel des Exponats
                    type: text
                short_text:
                    label: Kurztext
                    type: html
                    height: 150px
                text:
                    label: Text
                    type: html
                    height: 300px
    recordsperpage: 200
Slider:
    name: Slider
    singular_name: slider
    fields:
        title:
            group: info
            label: Titel
            type: text
        introText:
            label: Intro-Text zum Slider
            type: html
            height: 150px
        position:
            label: Ordnungsnummer
            type: integer
        slug:
            type: slug
            uses: [ title ]
        representation:
            group: Medien
            label: Digitalisat
            type: file
            upload: /representations
        exhibits:
            group: Exponate
            label: Exponate
            type: repeater
            icon: fa:repeat
            fields:
                object:
                    type: select
                    label: Objekt
                    values: objects/id,title
                    autocomplete: true
                    sort: title
                position:
                    type: integer
                    label: Position
                title:
                    label: Titel
                    type: text
                short_text:
                    label: Kurztext
                    type: html
                    height: 150px
                text:
                    label: Text
                    type: html
                    height: 300px
    recordsperpage: 200
    
locations:
    name: Orte
    singular_name: Orte
    fields:
        label:
            group: Info
            label: Bezeichnung
            type: text
            class: large
        slug:
            type: slug
            uses: [ label ]
        select_object:
            label: Objektbezug
            type: select
            values: objects/title
            postfix: Objekt auswählen
            autocomplete: true
            sort: title
        wd_id:
            label: Q-Nummer des Ortes bei Wikidata
            type: text
    recordsperpage: 200


# Pages can be used for the more 'static' pages on your site. This content-type
# has a 'templateselect' field, which allows you to override the record_template
# setting for an individual page.
# The taxonomy for this ContentType is defined as 'groups', which is a so-called
# "grouping taxonomy". This way you can easily group sets of pages that logically
# belong together. If your site has a 'services' section, in which you'd like to
# list the different types of services a company provides, you can group these
# together.

pages:
    name: Seiten
    singular_name: Seite
    fields:
        title:
            type: text
            class: large
            label: Titel
            group: content
        slug:
            type: slug
            uses: title
        body:
            type: html
            height: 300px
            label: Text
    recordsperpage: 20


